name: Deploy

on:
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]
    branches: [ master ]

permissions:
  contents: write

env:
  IMAGE_NAME: ghcr.io/michael-bailey/personal_website

jobs:
  update-prod:
    name: Update prod state
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: prod
          fetch-depth: 0

      - name: Fetch master
        run: git fetch origin master

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Cherry-pick latest master commit
        run: git cherry-pick ${{ github.event.workflow_run.head_sha }}

      - uses: imranismail/setup-kustomize@v2

      - name: Update image tag
        working-directory: deploy/overlays/prod
        run: |
          kustomize edit set image ${{ env.IMAGE_NAME }}=${{ env.IMAGE_NAME }}:sha-${{ github.event.workflow_run.head_sha }}

      - name: Fold tag change into the cherry-picked commit
        run: |
          git add -A
          git commit --amend --no-edit

      - name: Push
        run: git push origin HEAD:prod