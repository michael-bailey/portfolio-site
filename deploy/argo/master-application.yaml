apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: michael-bailey-net-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/michael-bailey/portfolio-site
    targetRevision: prod
    path: deploy/kustomise/overlays/prod

  destination:
    server: https://kubernetes.default.svc
    namespace: portfolio-site

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m