apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-site
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portfolio-site
  template:
    metadata:
      labels:
        app: portfolio-site
    spec:
      containers:
        - name: portfolio-site
          image:
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080